		* {

        body {
            font-family: Arial, sans-serif;

        .content {

        .clock {
            width: 100%;
            height: auto;
            display: block;
            justify-content: center;
            align-items: center;
        }

        /* Programmatic Clock Face Base */
        .clock-face {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            position: relative;
            background-color: #000000;
            border: 8px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin: 0 auto;
        }

        /* Center Pin */
        .clock-face::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ffff00;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Universal Tick Marker Styles */
        .tick {
            position: absolute;
            width: 2px;
            height: 100%;
            left: calc(50% - 1px);
            top: 0;
            transform-origin: 50% 50%;
        }
        .tick::before {
            content: '';
            display: block;
            width: 100%;
            height: 6px;
            background-color: #ffffff;
        }
        /* Major hour ticks override */
        .tick-major {
            width: 4px;
            left: calc(50% - 2px);
        }
        .tick-major::before {
            height: 14px;
            background-color: #ffffff;
        }

        /* Geometrically Balanced Clock Numbers */
        .clock-number {
            position: absolute;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            background-color: #333;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            z-index: 5;
        }

        .hour-hand {
            width: 6px;
            height: 70px;
            background-color: blue;
            left: calc(50% - 3px);
        }

        .minute-hand {
            width: 4px;
            height: 105px;
            background-color: DarkGreen;
            left: calc(50% - 2px);
        }

        .second-hand {
            width: 3px;
            height: 170px;
            background-color: #ff0000;
            left: calc(50% - 1px);
            border-radius: 0;
            bottom: calc(50% - 35px); 
            transform-origin: 50% calc(100% - 35px);
			z-index: 6;
        }

        .second-hand::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 50%;
            width: 14px;
            height: 14px;
            background-color: #ff0000;
            border-radius: 50%;
            transform: translate(-50%, 0);
        }

            flex-direction: column;

<script>
	let userTimeOffset = 0;
	let timeDifference = 0;
	let activeTheme = 'black'; // Holds current runtime theme profile status

	// Build Clock Dial with exact trig layout
	function buildClockDial() {
		const ticksContainer = document.getElementById('ticks-container');
		const numbersContainer = document.getElementById('numbers-container');
		ticksContainer.innerHTML = '';
		numbersContainer.innerHTML = '';

		for (let i = 0; i < 60; i++) {
			const tickEl = document.createElement('div');
			tickEl.className = (i % 5 === 0) ? 'tick tick-major' : 'tick';
			tickEl.style.transform = `rotate(${i * 6}deg)`;
			ticksContainer.appendChild(tickEl);
		}

		const radius = 122; 
		for (let i = 1; i <= 12; i++) {
			const numEl = document.createElement('div');
			numEl.className = 'clock-number';
			numEl.textContent = i;

			const angleRad = ((i * 30) - 90) * (Math.PI / 180);
			const x = Math.cos(angleRad) * radius;
			const y = Math.sin(angleRad) * radius;

			numEl.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
			numbersContainer.appendChild(numEl);
		}
	}
	buildClockDial();

	function updateDateDisplay(shouldShow) {
		const el = document.getElementById('display-date');
		if (!shouldShow) {
			el.textContent = '';
			return;
		}
		const now = new Date(new Date().getTime() + timeDifference + userTimeOffset);
		const options = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
		el.textContent = 'Date: ';

		const span = document.createElement('span');
		span.id = 'date-value-span'; 
		span.textContent = now.toLocaleDateString('en-GB', options);
		el.appendChild(span);
	}

	function applyTheme(color) {
		activeTheme = color;
		const body = document.body;
		const ths = document.querySelectorAll('.custom-table th');
		const digitalClock = document.getElementById('digital-clock');
		const amLabel = document.getElementById('am-label');
		const pmLabel = document.getElementById('pm-label');
		
		const dateLabel = document.getElementById('display-date');
		const timeLabel = document.getElementById('display-time-allowed');
		
		const dateValue = document.getElementById('date-value-span');
		const timeValue = document.getElementById('time-value-span');

		const analogFace = document.getElementById('analog-face');
		const numberElements = document.querySelectorAll('.clock-number');

		if (color === 'white') {
			body.style.backgroundColor = "white";
			digitalClock.style.color = "black";
			ths.forEach(th => th.style.color = "black");

			if(amLabel) amLabel.style.color = "black";
			if(pmLabel) pmLabel.style.color = "black";

			if (dateLabel) dateLabel.style.color = "black";
			if (timeLabel) timeLabel.style.color = "black";

			if (dateValue) dateValue.style.color = "#FF6600";
			if (timeValue) timeValue.style.color = "#FF0099";

			if (analogFace) {
				analogFace.style.backgroundColor = "#ffffff";
				analogFace.style.borderColor = "#000000";
			}
			document.querySelectorAll('.tick').forEach(el => el.style.setProperty('--tick-color', '#000000'));
			numberElements.forEach(el => el.style.color = "#000000");

		} else {
			body.style.backgroundColor = "black";
			digitalClock.style.color = "white";
			ths.forEach(th => th.style.color = "white");

			if(amLabel) amLabel.style.color = "white";
			if(pmLabel) pmLabel.style.color = "white";

			if (dateLabel) dateLabel.style.color = "white";
			if (timeLabel) timeLabel.style.color = "white";

			if (dateValue) dateValue.style.color = "#FFFF00";
			if (timeValue) timeValue.style.color = "#00FF00";

			if (analogFace) {
				analogFace.style.backgroundColor = "#000000";
				analogFace.style.borderColor = "#ffffff";
			}
			document.querySelectorAll('.tick').forEach(el => el.style.setProperty('--tick-color', '#ffffff'));
			numberElements.forEach(el => el.style.color = "#ffffff");
		}

		const dynamicStyleSheet = document.getElementById('dynamic-theme-ticks') || document.createElement('style');
		dynamicStyleSheet.id = 'dynamic-theme-ticks';
		dynamicStyleSheet.textContent = `.tick::before { background-color: var(--tick-color, #ffffff) !important; }`;
		if (!dynamicStyleSheet.parentNode) document.head.appendChild(dynamicStyleSheet);
	}

	function updateEverything() {
		const minsInput = document.getElementById('input-minutes').value;
		const mins = parseFloat(minsInput) || 0;
		userTimeOffset = mins * 60000;
		const timeAllowedVal = document.getElementById('input-time').value.trim();
		const fontSize = document.getElementById('input-font-size').value + "px";

		const announcementInput = document.getElementById('input-announcement').value.trim();
		const postDiv = document.getElementById('post-announcement');
    
		if (announcementInput === "") {
			postDiv.innerHTML = "";
			postDiv.classList.remove('has-content');
		} else {
			postDiv.innerHTML = announcementInput; 
			postDiv.classList.add('has-content');
		}
	
		const names = document.querySelectorAll('.sub-name');
		const exams = document.querySelectorAll('.sub-exam');
		const fromSeats = document.querySelectorAll('.sub-from');
		const toSeats = document.querySelectorAll('.sub-to');
		const tableBody = document.querySelector('.custom-table tbody');
		const tableHeader = document.querySelector('.custom-table thead');
		const customTable = document.querySelector('.custom-table');
		const tableData = [];
		
		tableBody.innerHTML = '';
		let hasData = false;

		names.forEach((nameInput, index) => {
			const nameVal = nameInput.value.trim();
			const examVal = exams[index].value.trim();
			const fromVal = fromSeats[index].value.trim();
			const toVal = toSeats[index].value.trim();
			tableData.push({ name: nameVal, exam: examVal, from: fromVal, to: toVal });

			if (nameVal !== "") {
				hasData = true;
				const rowClass = (tableBody.children.length % 2 === 0) ? 'data-row1' : 'data-row2';
				
				let seatFormat = "";
				if (fromVal && toVal) {
					seatFormat = `${fromVal} - ${toVal}`;
				} else if (fromVal) {
					seatFormat = fromVal;
				} else if (toVal) {
					seatFormat = toVal;
				}

				const row = `<tr class="${rowClass}">
					<td>${tableBody.children.length + 1})</td>
					<td>${nameVal}</td>
					<td>${examVal} <span class="highlight-code">xxx</span></td>
					<td>${seatFormat}</td>
				</tr>`;
				tableBody.innerHTML += row;
			}
		});

		updateDateDisplay(hasData);

		const timeDisplay = document.getElementById('display-time-allowed');
		if (hasData) {
			timeDisplay.textContent = "Time Allowed: ";
			const spanTimeDisplay = document.createElement('span');
			spanTimeDisplay.id = 'time-value-span';
			spanTimeDisplay.textContent = timeAllowedVal;
			timeDisplay.appendChild(spanTimeDisplay);
		} else {
			timeDisplay.textContent = "";
		}

		applyTheme(activeTheme);

		if (hasData) {
			customTable.style.display = 'table';
			tableHeader.style.display = 'table-header-group';
		} else {
			customTable.style.display = 'none';
			tableHeader.style.display = 'none';
		}
		
		customTable.style.fontSize = fontSize;
		postDiv.style.fontSize = fontSize;
		
		localStorage.setItem('timerSettings', JSON.stringify({
			mins: mins,
			timeAllowed: timeAllowedVal,
			fontSize: fontSize.replace('px', ''),
			theme: activeTheme,
			subjects: tableData,
			announcement: announcementInput
		}));
		updateClock();
	}

		window.addEventListener('load', () => {
			updateClock(); 
			
			const saved = localStorage.getItem('timerSettings');
			if (saved) {
				const data = JSON.parse(saved);
				document.getElementById('input-minutes').value = data.mins;
				document.getElementById('input-time').value = data.timeAllowed || '';
				document.getElementById('input-font-size').value = data.fontSize || 30;

				activeTheme = data.theme || 'black';

				const nameInputs = document.querySelectorAll('.sub-name');
				const examInputs = document.querySelectorAll('.sub-exam');
				const fromInputs = document.querySelectorAll('.sub-from');
				const toInputs = document.querySelectorAll('.sub-to');

				data.subjects.forEach((item, i) => {
					if (nameInputs[i]) nameInputs[i].value = item.name;
					if (examInputs[i]) examInputs[i].value = item.exam;
					if (fromInputs[i]) fromInputs[i].value = item.from || '';
					if (toInputs[i]) toInputs[i].value = item.to || '';
				});
				
				if (data.announcement) {
					document.getElementById('input-announcement').value = data.announcement !== undefined ? data.announcement : '';
				}
				
				updateEverything();
			} else {
				updateDateDisplay(false);
				applyTheme('black');
			}
		});

		document.getElementById('update-btn').addEventListener('click', updateEverything);

		document.getElementById('reset-data-btn').addEventListener('click', () => {
			localStorage.removeItem('timerSettings');
			document.querySelectorAll('.sub-name, .sub-exam, .sub-from, .sub-to').forEach(input => input.value = '');
			document.getElementById('input-minutes').value = 0;
			document.getElementById('input-time').value = ''; 
			document.getElementById('input-font-size').value = 30;
			document.getElementById('input-announcement').value = '';
			activeTheme = 'black';
			updateEverything();
		});

		// Instant Theme Switchers
		document.getElementById('theme-dark-btn').addEventListener('click', () => {
			applyTheme('black');
			// Re-run save state with updated activeTheme
			updateEverything();
		});

		document.getElementById('theme-light-btn').addEventListener('click', () => {
			applyTheme('white');
			// Re-run save state with updated activeTheme
			updateEverything();
		});

		function syncClock() {
			fetch('https://oleconnect.hkmu.edu.hk/time', { method: 'GET', cache: 'no-cache' })
				.then(response => response.json())
				.then(data => {
					const serverTime = new Date(data.serverTimeUnix);
					const localTime = new Date();
					timeDifference = serverTime - localTime;
					if (Math.abs(timeDifference) < 5000) timeDifference = 0;
				})
				.catch(error => console.error('Sync Error:', error));
		}

		function updateClock() {
			const now = new Date(new Date().getTime() + timeDifference + userTimeOffset);
			const hours = now.getHours();
			const minutes = now.getMinutes();
			const seconds = now.getSeconds();

			const hourDeg = ((hours % 12) * 30) + (minutes * 0.5);
			const minuteDeg = (minutes * 6) + (seconds * 0.1);
			const secondDeg = seconds * 6;

			document.querySelector('.hour-hand').style.transform = `rotate(${hourDeg}deg)`;
			document.querySelector('.minute-hand').style.transform = `rotate(${minuteDeg}deg)`;
			document.querySelector('.second-hand').style.transform = `rotate(${secondDeg}deg)`;

			const hours12 = hours % 12 || 12;
			const h = String(hours12);
			const m = String(minutes).padStart(2, '0');
			const s = String(seconds).padStart(2, '0');

			const digitalClock = document.getElementById('digital-clock');
			if (digitalClock) digitalClock.textContent = `${h}:${m}:${s}`;			
			
			const amLabel = document.getElementById('am-label');
			const pmLabel = document.getElementById('pm-label');
			
			if (hours < 12) {
				amLabel.style.opacity = "1";
				pmLabel.style.opacity = "0.2";
			} else {
				amLabel.style.opacity = "0.2";
				pmLabel.style.opacity = "1";
			}
		}

		syncClock();
		setInterval(syncClock, 300000);
		setInterval(updateClock, 1000);
</script>

</body>
</html>
